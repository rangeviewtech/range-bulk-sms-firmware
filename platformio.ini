; ============================================================================
; Range View Technologies - ESP32 SMS Gateway Firmware
; PlatformIO Configuration
; ============================================================================

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; File system for persistent config
board_build.filesystem = littlefs

; Partition scheme: 4MB with OTA + LittleFS
board_build.partitions = min_spiffs.csv

; Libraries
lib_deps =
    bblanchon/ArduinoJson@^7.1.0
    ; WiFiManager for captive portal (uses ESPAsyncWebServer internally)
    https://github.com/tzapu/WiFiManager.git#v2.0.17

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_LOG_DEFAULT_LEVEL=3
    -DARDUINOJSON_ENABLE_PROGMEM=1
    -DBOARD_HAS_PSRAM=0

; Monitor filters for readable output
monitor_filters = esp32_exception_decoder
